<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Years</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #F5C5BC;
            font-family: Arial, sans-serif;
            color: #4a2925;
            overflow: hidden;
        }

        /* =========================
           SLIDES
        ========================= */

        .slide {
            position: absolute;
            inset: 0;

            display: none;

            flex-direction: column;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .slide.active {
            display: flex;
        }

        /* =========================
           MAIN BOX
        ========================= */

        .box {
            width: 420px;
            min-height: 500px;

            background: #fff5f2;

            border: 2px solid #d99d92;
            border-radius: 18px;

            padding: 30px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;

            text-align: center;

            box-shadow: 0 10px 30px rgba(100, 50, 45, 0.15);
        }

        .box h1 {
            font-size: 32px;
            font-weight: 600;
        }

        .box img {
            width: 320px;
            height: 300px;

            object-fit: cover;

            border-radius: 12px;
            border: 2px solid #e2aaa0;
        }

        .box p {
            font-size: 20px;
        }

        /* =========================
           BUTTON CONTAINER
        ========================= */

        .button-container {
            position: relative;

            display: inline-block;

            margin-top: 25px;

            padding: 3px;
        }

        /* =========================
           BUTTON
        ========================= */

        .button-container button {
            position: relative;
            z-index: 2;

            display: block;

            margin: 0;

            padding: 13px 28px;

            border: none;
            border-radius: 10px;

            background: #c98e83;
            color: white;

            font-size: 17px;
            font-family: Arial, sans-serif;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .button-container button:hover {
            background: #ad7167;
            transform: translateY(-2px);
        }

        /* =========================
           ANIMATED BORDER
        ========================= */

        .border-animation {
            position: absolute;

            top: -4px;
            left: -4px;

            width: calc(100% + 8px);
            height: calc(100% + 8px);

            pointer-events: none;

            z-index: 3;

            overflow: visible;
        }

        .border-animation rect {
            fill: none;

            stroke: #ffffff;
            stroke-width: 3;

            stroke-linecap: round;

            pathLength: 1;

            stroke-dasharray: 0.13 0.87;
            stroke-dashoffset: 0;

            animation: traceBorder 2s linear infinite;
        }

        @keyframes traceBorder {
            from {
                stroke-dashoffset: 0;
            }

            to {
                stroke-dashoffset: -1;
            }
        }

        /* =========================
           QUESTION MARK
        ========================= */

        .question-mark {
            width: 320px;
            height: 300px;

            border-radius: 12px;
            border: 2px solid #e2aaa0;

            background: #fbe4df;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 100px;
            font-weight: bold;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .box {
                width: 90%;
                min-height: 450px;
                padding: 25px;
            }

            .box img,
            .question-mark {
                width: 100%;
                height: 260px;
            }
        }
    </style>
</head>

<body>


    <!-- =================================
         SLIDE 1 — MAIN
    ================================== -->

    <div class="slide active" id="slide1">

        <div class="box">

            <h1>22 years</h1>

            <img

        <div class="button-container">

                    ry="10"

    <!-- =================================
         JAVASCRIPT
    ================================== -->

    <script>

        let currentSlide = 1;


        function nextSlide() {

            const current = document.getElementById(
                "slide" + currentSlide
            );

            if (current) {
                current.classList.remove("active");
            }


            currentSlide++;


            const next = document.getElementById(
                "slide" + currentSlide
            );

            if (next) {
                next.classList.add("active");
            }

        }

    </script>
