<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>22 Years</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page active" id="home">
        <div class="main-box">
            <h1>22 years</h1>

            <img src="images/main.jpg" alt="Main Photo" class="main-photo">

            <p>September, 2004</p>

            <button onclick="showPage('kids')">List of Kids</button>
        </div>
    </div>

    <div class="page" id="kids">

        <!-- Kid 1 -->
        <div class="kid-page active">
            <div class="main-box">
                <h1>Kid One</h1>

                <img src="images/kid1.jpg" alt="Kid One" class="kid-photo">

                <button onclick="nextKid()">Next</button>
            </div>
        </div>

        <!-- Kid 2 -->
        <div class="kid-page">
            <div class="main-box">
                <h1>Kid Two</h1>

                <img src="images/kid2.jpg" alt="Kid Two" class="kid-photo">

                <button onclick="nextKid()">Next</button>
            </div>
        </div>

        <!-- Kid 3 -->
        <div class="kid-page">
            <div class="main-box">
                <h1>Kid Three</h1>

                <img src="images/kid3.jpg" alt="Kid Three" class="kid-photo">

                <button onclick="nextKid()">Next</button>
            </div>
        </div>

        <!-- Kid 4 -->
        <div class="kid-page">
            <div class="main-box">
                <h1>Kid Four</h1>

                <img src="images/kid4.jpg" alt="Kid Four" class="kid-photo">

                <button onclick="nextKid()">Next</button>
            </div>
        </div>

        <!-- Kid 5 -->
        <div class="kid-page">
            <div class="main-box">
                <h1>Kid Five</h1>

                <img src="images/kid5.jpg" alt="Kid Five" class="kid-photo">

                <button onclick="nextKid()">Next</button>
            </div>
        </div>

        <!-- Mystery Kid -->
        <div class="kid-page">
            <div class="main-box mystery">
                <h1>?</h1>

                <div class="question-box">?</div>

                <p>i wonder what the next kid will be..</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
